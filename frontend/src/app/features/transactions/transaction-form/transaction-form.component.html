<div class="modal-overlay" (click)="$event.target === $event.currentTarget && cancelled.emit()">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">{{ transaction ? 'Edit Transaction' : 'Add Transaction' }}</h3>
      <button class="modal-close" (click)="cancelled.emit()">✕</button>
    </div>

    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Type Toggle -->
      <div class="type-toggle">
        <button
          type="button"
          class="type-btn"
          [class.active-expense]="form.get('type')?.value === 'EXPENSE'"
          (click)="form.get('type')?.setValue('EXPENSE')"
        >
          ↓ Expense
        </button>
        <button
          type="button"
          class="type-btn"
          [class.active-income]="form.get('type')?.value === 'INCOME'"
          (click)="form.get('type')?.setValue('INCOME')"
        >
          ↑ Income
        </button>
      </div>

      <div class="form-group">
        <label>Amount</label>
        <input type="number" formControlName="amount" class="form-control" placeholder="0.00" step="0.01" min="0.01" />
        @if (form.get('amount')?.invalid && form.get('amount')?.touched) {
          <span class="form-error">Enter a valid amount greater than 0</span>
        }
      </div>

      <div class="form-group">
        <label>Description</label>
        <input type="text" formControlName="description" class="form-control" placeholder="What was this for?" />
        @if (form.get('description')?.invalid && form.get('description')?.touched) {
          <span class="form-error">Description is required</span>
        }
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date</label>
          <input type="date" formControlName="transactionDate" class="form-control" />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select formControlName="categoryId" class="form-control">
            <option [ngValue]="null">No category</option>
            @for (cat of filteredCategories; track cat.id) {
              <option [value]="cat.id">{{ cat.name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Account</label>
        <select formControlName="accountId" class="form-control">
          <option [ngValue]="null">No account</option>
          @for (acc of accounts(); track acc.id) {
            <option [value]="acc.id">{{ acc.name }} ({{ acc.bankName }})</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label>Notes <span class="text-secondary text-sm">(optional)</span></label>
        <textarea formControlName="notes" class="form-control" rows="2" placeholder="Add any notes..."></textarea>
      </div>

      <div class="form-group">
        <label>Tags <span class="text-secondary text-sm">(comma separated)</span></label>
        <input type="text" formControlName="tags" class="form-control" placeholder="e.g. food, dining, work" />
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          @if (loading()) { Saving... } @else { {{ transaction ? 'Update' : 'Add Transaction' }} }
        </button>
      </div>
    </form>
  </div>
</div>
