spring.datasource.url=jdbc:postgresql://localhost:5432/clearpath_budget
# TODO: Set your PostgreSQL username here
spring.datasource.username=YOUR_DB_USERNAME
# TODO: Set your PostgreSQL password here
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
jwt.secret=clearpath-budget-jwt-secret-key-must-be-256-bits-long-for-hs256
jwt.expiration=86400000
# TODO: Configure your SMTP email credentials here
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_EMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.url=http://localhost:4200
# TODO: Add Stripe API key: stripe.api-key=sk_live_YOUR_KEY_HERE
# TODO: Add Stripe webhook secret: stripe.webhook-secret=whsec_YOUR_SECRET
