spring.application.name=agentflow-backend
server.port=8080

# H2 in-memory DB — no setup required
spring.datasource.url=jdbc:h2:mem:agentflowdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Async thread pool
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# JWT — TODO: replace secret with a 256-bit random value from a secrets manager
app.jwt.secret=CHANGE_ME_use_a_long_random_256bit_secret_never_commit_this
app.jwt.expiration-ms=86400000

# Credits
app.credits.free-monthly-allowance=50
app.credits.max-workflows-per-hour=5

# Subscription plans (monthly credits)
app.credits.starter-monthly-allowance=500
app.credits.pro-monthly-allowance=2000

